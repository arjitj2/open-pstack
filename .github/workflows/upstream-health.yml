name: Report upstream maintenance
on:
  schedule:
    - cron: '41 11 * * 1'
  workflow_dispatch:
permissions: {}
concurrency:
  group: fork-maintenance
  cancel-in-progress: false
jobs:
  health:
    if: github.repository == 'arjitj2/open-pstack'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
      - name: Update the maintenance report
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/fork-maintenance.py weekly
