name: Validate Cursor catalog candidate
on:
  workflow_dispatch:
    inputs:
      pr:
        description: Proposal pull request number
        required: true
      head:
        description: Expected proposal head commit
        required: true
      base:
        description: Expected maintained main commit
        required: true
      target:
        description: Expected Cursor pstack commit
        required: true
permissions: {}
concurrency:
  group: sync-candidate-${{ inputs.pr }}
  cancel-in-progress: true
jobs:
  verify:
    if: github.repository == 'arjitj2/open-pstack' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
      - name: Validate the metadata-only proposal
        env:
          GH_TOKEN: ${{ github.token }}
          CANDIDATE_PR: ${{ inputs.pr }}
          CANDIDATE_HEAD: ${{ inputs.head }}
          CANDIDATE_BASE: ${{ inputs.base }}
          CANDIDATE_TARGET: ${{ inputs.target }}
        run: >-
          python3 scripts/fork-maintenance.py check-candidate
          --pr "$CANDIDATE_PR" --head "$CANDIDATE_HEAD"
          --base "$CANDIDATE_BASE" --target "$CANDIDATE_TARGET"
      - name: Check the proposed ledger
        env:
          CANDIDATE_HEAD: ${{ inputs.head }}
        run: |
          git show "$CANDIDATE_HEAD:maintenance/upstream-ledger.json" > candidate-ledger.json
          python3 scripts/fork-maintenance.py check-ledger --file candidate-ledger.json
      - name: Test fork maintenance
        run: python3 tests/test-fork-maintenance.py
  report:
    needs: verify
    if: always() && github.repository == 'arjitj2/open-pstack' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      statuses: write
      pull-requests: read
    steps:
      - name: Attach result to the reviewed head
        env:
          GH_TOKEN: ${{ github.token }}
          CANDIDATE_PR: ${{ inputs.pr }}
          CANDIDATE_HEAD: ${{ inputs.head }}
          CANDIDATE_BASE: ${{ inputs.base }}
          CANDIDATE_TARGET: ${{ inputs.target }}
          RESULT: ${{ needs.verify.result }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          python3 - <<'PY'
          import json, os, re, subprocess
          pr, head, base = [os.environ[k] for k in ('CANDIDATE_PR', 'CANDIDATE_HEAD', 'CANDIDATE_BASE')]
          assert re.fullmatch(r'[1-9][0-9]*', pr)
          assert all(re.fullmatch(r'[0-9a-f]{40}', sha) for sha in (head, base))
          current = json.loads(subprocess.check_output(['gh', 'api', f'repos/arjitj2/open-pstack/pulls/{pr}']))
          head_repo = (current.get('head') or {}).get('repo') or {}
          if head_repo.get('full_name') != 'arjitj2/open-pstack':
              raise SystemExit('Candidate head is not in this repository; no status published.')
          if current['state'] != 'open' or current['head']['sha'] != head or current['base']['sha'] != base:
              raise SystemExit('Candidate was superseded; no stale status published.')
          branch = 'automation/cursor-' + os.environ['CANDIDATE_TARGET'][:12] + '-' + base[:12]
          if current['base']['ref'] != 'main' or current['head']['ref'] != branch:
              raise SystemExit('Candidate branch changed; no stale status published.')
          payload = {'state': 'success' if os.environ['RESULT'] == 'success' else 'failure',
                     'context': 'cursor-catalog/candidate',
                     'description': 'Metadata-only proposal validation; adoption still requires a normal PR with installed-host evidence.',
                     'target_url': os.environ['RUN_URL']}
          subprocess.run(['gh', 'api', f'repos/arjitj2/open-pstack/statuses/{head}', '--method', 'POST', '--input', '-'],
                         input=json.dumps(payload), text=True, check=True)
          PY
